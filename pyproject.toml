[project]
name = "pcbkit"
version = "0.1.0"
description = "Agent-driven PCB design toolkit: Python circuit IR to production-ready KiCad projects and fab output"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    # Schematic writer. Emits the KiCad 9 format, so the emitter always follows
    # it with `kicad-cli sch upgrade` -- see docs/sdlc/M3/spike.md.
    "kicad-sch-api>=0.5.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
pcbkit = "pcbkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcbkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
